<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoCPK Comparison Lab</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>SoCPK</strong>
        <small>Comparison Lab</small>
      </span>
    </div>

    <nav class="tabs" id="tabs" aria-label="Dataset"></nav>

    <div class="actions">
      <button class="btn" id="reload" type="button">Reload data</button>
      <div class="menu">
        <button class="btn btn-accent" id="export" type="button" aria-haspopup="true" aria-expanded="false">Export chart</button>
        <div class="menu-pop" id="export-menu" hidden>
          <button type="button" data-format="png">PNG image</button>
          <button type="button" data-format="svg">SVG vector</button>
        </div>
      </div>
      <span class="source-note" id="source-note"></span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
    </div>
    <div class="stats">
      <div class="stat" data-tone="accent">
        <span class="stat-label">Profiles</span>
        <span class="stat-value" id="stat-profiles">—</span>
      </div>
      <div class="stat" data-tone="cyan">
        <span class="stat-label">Data points</span>
        <span class="stat-value" id="stat-points">—</span>
      </div>
      <div class="stat stat-wide" data-tone="green">
        <span class="stat-label">Current leader</span>
        <span class="stat-value" id="stat-leader">—</span>
      </div>
    </div>
  </section>

  <main class="body">
    <aside class="sidebar">
      <label class="field-label" for="view">Compare</label>
      <div class="select-wrap">
        <select id="view"></select>
      </div>

      <div class="panel-tabs" id="list-tabs" role="tablist" hidden>
        <button type="button" role="tab" data-list="devices">Devices</button>
        <button type="button" role="tab" data-list="socs">Processors</button>
      </div>

      <label class="switch" title="Lines of constant efficiency (score/W for CPU/GPU, W for batteries)">
        <input type="checkbox" id="reference-toggle" checked>
        <span>Efficiency reference</span>
      </label>

      <label class="switch" id="measured-wrap" hidden>
        <input type="checkbox" id="measured-toggle" checked>
        <span>Geekerwan measured capacity</span>
      </label>

      <label class="switch" id="overlay-wrap" hidden>
        <input type="checkbox" id="overlay-toggle">
        <span>Overlay average lines</span>
      </label>

      <label class="field-label" for="search" id="search-label">Search profiles</label>
      <input id="search" type="search" placeholder="Chip or core name" autocomplete="off" spellcheck="false">

      <div class="quick" id="quick">
        <button class="chip" type="button" data-mode="top5">Top 5</button>
        <button class="chip" type="button" data-mode="all">All shown</button>
        <button class="chip" type="button" data-mode="clear">Clear</button>
      </div>

      <section class="core-filter" id="core-filter" hidden>
        <p class="field-label">Filter cores</p>
        <div class="chip-row" id="core-groups"></div>
        <div class="menu menu-block">
          <button class="chip chip-wide" id="core-names-button" type="button" aria-haspopup="true" aria-expanded="false">All core names</button>
          <div class="menu-pop menu-pop-list" id="core-names-menu" hidden></div>
        </div>
      </section>

      <p class="selection-note" id="selection-note"></p>

      <div class="profile-list" id="profile-list" role="listbox" aria-multiselectable="true" tabindex="0"></div>
    </aside>

    <section class="chart-panel">
      <div class="chart-stage" id="chart-stage">
        <canvas id="chart-base"></canvas>
        <canvas id="chart-overlay"></canvas>
      </div>
      <footer class="chart-footer">
        <span class="chart-note" id="chart-note"></span>
        <span class="rank-hint" id="rank-hint"></span>
      </footer>
      <div class="reference-slot"><div class="chart-footer" id="reference-note" hidden></div></div>
    </section>
  </main>
  <details class="analytics" id="analytics" open>
    <summary>Analysis lab <span>Targets, trade-offs and baseline comparisons</span></summary>
    <div id="analysis-controls" class="analysis-controls"></div>
    <div id="analysis-results" aria-live="polite"></div>
  </details>
</div>

<div class="toast" id="toast" hidden></div>

<script src="colors.js"></script>
<script src="chart.js"></script>
<script src="analytics.js"></script>
<script src="app.js"></script>
</body>
</html>
